var SET=DATA.set, ITEMS=DATA.items, N=ITEMS.length, KEY='visho-review-'+SET, VER='r4';
var TAGS=['Sounds translated','English word in it','Too formal','Not GCC marketing language','Grammar / spelling','Wrong meaning','Too long','Unclear'];
var CH={line:[['A','A is better'],['B','B is better'],['E','Equal'],['N','Both bad']],web:[['G','Good as is'],['F','Needs a small fix'],['W','Wrong or unnatural']],video:[['G','Arabic is natural'],['F','Needs small fixes'],['W','Has mistakes']]};
var COUNTRIES=['Saudi Arabia','UAE','Kuwait','Qatar','Bahrain','Oman','Other'];
function fresh(){return {ver:VER,name:'',country:'',i:0,ans:{},t0:Date.now(),started:false,done:false}}
var S=fresh();
var app=document.getElementById('app'),bar=document.getElementById('bar'),barIn=document.getElementById('barIn');
function tell(event,page){try{if(navigator.webdriver||location.protocol!=='https:')return;
 fetch('https://wnzgbxugveigjgevygtn.supabase.co/functions/v1/teller',{method:'POST',keepalive:true,mode:'cors',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({page:'/review/ar'+(page||''),source:'direct',event:event})}).catch(function(){})}catch(e){}}
function milestone(){var n=S.i+1;[10,20,30,40].forEach(function(m){if(n>=m&&!(S.seen||{})[m]){S.seen=S.seen||{};S.seen[m]=1;tell('visit','/q'+m)}})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.ans&&x.ver===VER)S=x}catch(e){}}
function top(right,noRestart){return '<div class="top"><span>'+WORDMARK+'</span><span class="grow"></span>'+(right||'')+(noRestart?'':'<button class="rs" id="rs" aria-label="Restart from the beginning">Restart</button>')+'</div>'}
function restart(){if(!confirm('Start again from the beginning? Your answers on this phone will be cleared.'))return;S=fresh();save();intro();scrollTo(0,0)}
document.addEventListener('click',function(e){if(e.target.closest('#rs'))restart()});
function setBar(h){barIn.innerHTML=h;bar.hidden=!h}
function answered(){return Object.keys(S.ans).filter(function(k){return S.ans[k]&&S.ans[k].c}).length}

/* ---------- 1 · start ---------- */
function intro(){
 var resume=S.started&&answered()>0;
 app.innerHTML=top('<span class="eb">Soraya · Arabic review</span>')+
 '<div class="stack"><p class="eb">VISHŌ × Soraya · thank you for helping</p><h1>Which Arabic reads better?</h1><p class="lead">For the <b>Soraya</b> project we are training our Arabic writing for marketing in the GCC. Your eye as a native speaker decides what good Arabic is.</p>'+
 '<p class="lead">Three short parts. <b>1</b> Watch a Soraya video, then compare each of its lines with another Arabic version. <b>2</b> The same for a second video. <b>3</b> Check 20 lines of the VISHŌ website in Arabic. Judge the Arabic as <b>GCC marketing language</b>: is the meaning clear, does it fit the context, and does it sound like a strong Gulf brand wrote it? If you want, write the correct version or a comment, in any language.</p>'+
 '<p class="ar mut" style="font-size:17px">شكراً لمساعدتك. ضمن مشروع «ثريا»، شاهد مقطعي فيديو قصيرين، ثم قارن الجمل الواردة فيهما، وراجع ٢٠ جملة من موقع VISHŌ. قيّم الصياغة العربية من منظور التسويق في الخليج: هل المعنى واضح؟ هل الصياغة مناسبة للسياق؟ وهل تعكس نبرة علامة تجارية خليجية قوية؟ يمكنك كتابة الصياغة الصحيحة أو إضافة تعليق بأي لغة.</p>'+
 '<div class="card"><label class="f"><span class="eb">Your first name</span><input type="text" id="nm" autocomplete="given-name" maxlength="60" value="'+esc(S.name)+'" placeholder="First name"></label>'+
 
 '<p class="note">About 30 minutes. Your answers stay on this phone while you work; you can stop and come back with the same link. We only count how many people open and finish this page: no cookies, no personal data. At the end you send one completed link back to Yassin.</p><p class="note"><b>Tip:</b> opened this from WhatsApp? Tap ⋯ and choose <b>Open in Safari</b> (or Chrome), so your answers stay saved if you close it.</p><p class="err" id="er" hidden></p></div></div>';
 setBar('<button class="btn pri" id="go">'+(resume?'Continue · '+answered()+' of '+N+' done':'Start')+'</button>');
 document.getElementById('nm').oninput=function(){S.name=this.value.trim();save()};
 document.getElementById('go').onclick=function(){S.name=document.getElementById('nm').value.trim();
  if(S.name.length<2){var er=document.getElementById('er');er.textContent='Please write your first name: Yassin needs it to know whose answers these are.';er.hidden=false;return}
  if(!resume)tell('form_start');S.started=true;if(!resume)S.i=0;save();item()}}

/* ---------- 2 · one text ---------- */
function item(){
 milestone();var it=ITEMS[S.i],a=S.ans[it.id]||(S.ans[it.id]={c:'',tags:[],fix:'',note:'',ms:0}),t0=Date.now(),ch=CH[it.kind];
 var part=it.kind==='web'?'Part 3 of 3 · VISHŌ website · '+it.where.replace(/^.*?· /,''):'Part '+it.part+' of 3 · '+(it.kind==='video'?'watch the video':it.where);
 function side(k){return '<div class="side'+(a.c===k?' on':'')+'"><div class="lab"><span class="eb">Version '+k+'</span></div><div class="txt ar">'+esc(it[k])+'</div></div>'}
 var body='';
 if(it.kind==='video')body='<p class="lead">'+esc(it.where)+'</p><video src="'+esc(it.src)+'" controls playsinline preload="metadata" style="width:100%;max-height:70vh;border-radius:14px;background:#000"></video><p class="note">Watch it with sound. Is the Arabic (voice and captions) correct, natural GCC marketing language?</p>';
 else if(it.kind==='line')body='<p class="en">English meaning: '+esc(it.en)+'</p><div class="pair stack">'+side('A')+side('B')+'</div><p class="note">Judge the wording as GCC marketing Arabic, not the vowel marks (tashkeel).</p>';
 else body='<p class="eb">On the website (English, exactly as written)</p><div class="txt" style="font-size:17px">'+esc(it.en)+'</div><p class="eb">In Arabic · for GCC marketing</p><div class="txt ar">'+esc(it.ar)+'</div>';
 var fixLabel=it.kind==='video'?'Which line is wrong, and how should it be? (optional)':'The correct version (optional)';
 app.innerHTML=top('<span class="pill">'+(S.i+1)+' / '+N+'</span>')+
 '<div class="prog">'+ITEMS.map(function(x,j){return '<i class="'+(j===S.i?'c':(S.ans[x.id]&&S.ans[x.id].c?'d':''))+'"></i>'}).join('')+'</div>'+
 '<div class="stack"><p class="eb">'+esc(part)+'</p>'+body+
 '<div class="opts" role="group" aria-label="Your choice" style="grid-template-columns:repeat('+(ch.length===4?2:1)+',1fr)">'+ch.map(function(c){return '<button class="o'+(c[0]==='N'||c[0]==='W'?' bad':'')+(a.c===c[0]?' on':'')+'" data-o="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'+
 '<div class="card" id="more"'+(a.c?'':' hidden')+'><div id="tgw" class="stack"><span class="eb" id="tgl">What is wrong? (optional, tap all that fit)</span><div class="chips" id="tg">'+TAGS.map(function(t){return '<button class="chip'+(a.tags.indexOf(t)>=0?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div></div>'+
 '<label class="f"><span class="eb" id="fxl">'+fixLabel+'</span><textarea id="fx" class="'+(it.kind==='video'?'':'ar')+'" dir="'+(it.kind==='video'?'auto':'rtl')+'" placeholder="'+(it.kind==='video'?'e.g. the line at 0:12 should be …':'اكتب الصياغة الصحيحة هنا')+'">'+esc(a.fix||(a.c==='F'&&it.kind==='web'?it.ar:''))+'</textarea></label>'+
 '<label class="f"><span class="eb">Comment · any language (optional)</span><textarea id="cm" dir="auto" style="min-height:70px" placeholder="Why, or anything we should know">'+esc(a.note)+'</textarea></label></div></div>';
 function labels(){var c=a.c,tw=document.getElementById('tgw'),tl=document.getElementById('tgl'),fl=document.getElementById('fxl');
  tw.hidden=(c==='G'||c==='E');tl.textContent=(c==='A'||c==='B')?'What is wrong with the other version? (optional)':'What is wrong? (optional, tap all that fit)';
  fl.textContent=it.kind==='video'?'Which line is wrong, and how should it be? (optional)':(c==='N'||c==='F'||c==='W')?'The correct version (optional)':'An even better version (optional)'}
 if(a.c)labels();
 function next(){a.fix=document.getElementById('fx').value.trim();a.note=document.getElementById('cm').value.trim();if(it.kind==='web'&&a.fix===it.ar)a.fix='';a.ms+=Date.now()-t0;var v=app.querySelector('video');if(v)v.pause();save()}
 app.querySelector('.opts').onclick=function(e){var b=e.target.closest('[data-o]');if(!b)return;a.c=b.dataset.o;save();
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});
  app.querySelectorAll('.side').forEach(function(s,j){s.classList.toggle('on',(j===0&&a.c==='A')||(j===1&&a.c==='B'))});
  var fx=document.getElementById('fx');if(it.kind==='web'&&a.c==='F'&&!fx.value)fx.value=it.ar;
  labels();document.getElementById('more').hidden=false;document.getElementById('nx').disabled=false};
 document.getElementById('tg').onclick=function(e){var b=e.target.closest('[data-t]');if(!b)return;var t=b.dataset.t,k=a.tags.indexOf(t);if(k>=0)a.tags.splice(k,1);else a.tags.push(t);b.classList.toggle('on',k<0);save()};
 setBar((S.i>0?'<button class="btn" id="bk" aria-label="Previous">←</button>':'')+'<button class="btn pri" id="nx"'+(a.c?'':' disabled')+'>'+(S.i===N-1?'Finish':'Next')+'</button>');
 if(document.getElementById('bk'))document.getElementById('bk').onclick=function(){next();S.i--;save();item();scrollTo(0,0)};
 document.getElementById('nx').onclick=function(){if(!a.c)return;next();if(S.i<N-1){S.i++;save();item();scrollTo(0,0)}else{finish()}}}

/* ---------- 3 · completed link ---------- */
function b64u(bytes){var s='';for(var i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function packJSON(){return {v:1,set:SET,name:S.name,country:S.country,t:new Date().toISOString(),
 items:ITEMS.map(function(it){var a=S.ans[it.id]||{};return {id:it.id,c:a.c||'',tags:(a.tags||[]).map(function(t){return TAGS.indexOf(t)}),fix:a.fix||'',note:a.note||'',ms:a.ms||0}})}}
function pack(){var raw=new TextEncoder().encode(JSON.stringify(packJSON()));
 if(window.CompressionStream){return new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(function(b){return 'z'+b64u(new Uint8Array(b))})}
 return Promise.resolve('j'+b64u(raw))}
function unpack(s){var u=unb64u(s.slice(1));if(s[0]==='z')return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(JSON.parse);return Promise.resolve(JSON.parse(new TextDecoder().decode(u)))}
function finish(){if(!S.sent){S.sent=1;tell('form_sent')}S.done=true;save();
 var n=answered(),fx=0,cm=0;ITEMS.forEach(function(it){var a=S.ans[it.id]||{};if(a.fix)fx++;if(a.note)cm++});
 pack().then(function(code){
  var url=location.origin+location.pathname+'#done='+code,msg='Soraya Arabic review completed by '+S.name+' ('+n+'/'+N+'): '+url;
  app.innerHTML=top('<span class="pill">'+n+' / '+N+'</span>')+'<div class="stack"><p class="eb">Finished</p><h1>Thank you, '+esc(S.name.split(' ')[0])+'.</h1>'+
  '<div class="kv"><div><b>'+n+'</b><span>answers</span></div><div><b>'+fx+'</b><span>corrected</span></div><div><b>'+cm+'</b><span>comments</span></div></div>'+
  '<div class="card"><p class="lead"><b>Send this completed link back to Yassin.</b> Your name and answers are inside it; nothing was sent anywhere else.</p><div class="txt link" id="lk">'+esc(url)+'</div>'+
  '<div class="opts"><button class="o on" id="sh">Send to Yassin</button><button class="o" id="cp">Copy link</button></div>'+
  '<button class="o" id="dl" style="width:100%">Download as file (backup)</button><p class="note" id="st"></p></div>'+
  '<button class="btn" id="ed" style="width:100%">Change my answers</button><button class="btn" id="nw" style="width:100%">New review (another person on this phone)</button></div>';
  setBar('');
  document.getElementById('sh').onclick=function(){tell('wa');if(navigator.share){navigator.share({title:'Soraya Arabic review · '+S.name,text:msg}).catch(function(){})}else{location.href='https://wa.me/?text='+encodeURIComponent(msg)}};
  document.getElementById('cp').onclick=function(){var st=document.getElementById('st');(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){st.textContent='Copied. Paste it in your chat with Yassin.'},function(){st.textContent='Press and hold the link above, then copy it.'})};
  document.getElementById('dl').onclick=function(){var b=new Blob([JSON.stringify(packJSON(),null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='soraya-arabic-review-'+S.name.replace(/[^\w؀-ۿ]+/g,'-')+'.json';a.click()};
  document.getElementById('ed').onclick=function(){S.done=false;S.i=0;save();item();scrollTo(0,0)};
  document.getElementById('nw').onclick=function(){if(!confirm('Start a new review for another person? Send your completed link to Yassin first.'))return;S=fresh();save();intro();scrollTo(0,0)};
 })}

/* ---------- 4 · a completed link opened again (Yassin / Brahim) ---------- */
function viewDone(code){setBar('');app.innerHTML=top('',1)+'<p class="mut">Reading…</p>';
 unpack(code).then(function(d){var n=d.items.filter(function(x){return x.c}).length;
  app.innerHTML=top('<span class="pill">'+n+' / '+N+'</span>',1)+'<div class="stack"><p class="eb">Soraya · completed Arabic review</p><h1>'+esc(d.name)+'</h1><p class="lead">'+esc(String(d.t).slice(0,10))+'</p>'+
  '<div class="card"><p>This link holds '+esc(d.name)+'’s answers. <b>Yassin:</b> please forward this link to Brahim (VISHŌ). Nothing needs to be done on this page.</p></div></div>'},
 function(){app.innerHTML=top('',1)+'<div class="card"><p class="err">This link looks incomplete. Ask the reviewer to copy it again.</p></div>'})}

var h=location.hash.match(/#done=([zj][\w-]+)/);
if(h){viewDone(h[1])}else{tell('visit');load();if(S.done)finish();else if(S.started&&answered()>0&&S.i<N)item();else intro()}
})();
</script>
</body>
</html>
